name: "Build and deploy to GitHub Pages"

on:
  push:
    branches: ["main"]
  workflow_dispatch:


# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true


jobs:
  build:
    runs-on: "ubuntu-latest"
    steps:
      # Build the Portolan catalog
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1

      - name: "Install uv"
        uses: "astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d" # v10.0.1

      - run: "uv run $(basename $PWD) /tmp/_site"


      # Build Portolan browser
      - name: "Checkout Portolan Browser repo"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          repository: "portolan-sdi/portolan-browser"
          persist-credentials: false
          path: "portolan-browser"

      - name: "Install pnpm"
        working-directory: "portolan-browser"
        uses: "pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1"  # v3
        with:
          version: "11"
          runtime: "node@24"
          cache: true

      - name: "Build Portolan Browser"
        working-directory: "portolan-browser"
        run: "pnpm run build"

      - name: "Copy portolan browser to output dir"
        run: "cp -R dist/* /tmp/_site"




      - name: "Upload site artifact"
        uses: "actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa"  # v3
        with:
          path: "/tmp/_site"

  deploy:
    runs-on: "ubuntu-latest"
    needs: "build"
    environment:
      name: "github-pages"
      url: "${{ steps.deployment.outputs.page_url }}"
    permissions:
      pages: "write"
      id-token: "write"
    steps:
      - name: "Deploy to GitHub Pages"
        id: "deployment"
        uses: "actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e"  # v4
