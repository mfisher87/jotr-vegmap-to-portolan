name: "Build and deploy to jotr-nps-portolan.org"

on:
  push:
    branches: ["main"]
  workflow_dispatch:


# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true


jobs:
  build:
    runs-on: "ubuntu-latest"
    env:
      PUBLISH_URL: "https://jotr-nps-portolan.org/"
    steps:
      # Build the Portolan catalog
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1

      - name: "Install uv"
        uses: "astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d" # v10.0.1

      - run: "uv run $(basename $PWD) /tmp/_site"

      # Build Portolan browser
      - name: "Checkout Portolan Browser repo"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          repository: "portolan-sdi/portolan-browser"
          persist-credentials: false
          path: "portolan-browser"

      - name: "Install pnpm"
        uses: "pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1"  # v3
        with:
          version: "11"
          runtime: "node@24"
          cache: true
          working-directory: "portolan-browser"

      - name: "Build Portolan Browser"
        working-directory: "portolan-browser"
        run: |
          SB_catalogUrl="${PUBLISH_URL}/catalog.json" \
          pnpm run build

      - name: "Copy portolan browser to output dir"
        working-directory: "portolan-browser"
        run: "cp -R dist/* /tmp/_site"

      - name: "Upload artifact"
        uses: "actions/upload-artifact@v7.0.2"
        with:
          name: "site"
          path: "/tmp/_site/"

  deploy:
    environment: "sftp"
    needs: ["build"]
    runs-on: "ubuntu-latest"
    steps:
      - name: "Download artifact"
        uses: "actions/download-artifact@v8.0.2"
        with:
          name: "site"
          path: "/tmp/_site/"

      - name: "Install SSH client and sshpass"
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client sshpass

      - name: "Setup SSH known hosts"
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H -p 22 ${{ secrets.SFTPHOST }} >> ~/.ssh/known_hosts

      - name: "Deploy to Sam's SFTP server"
        env:
          SSHPASS: "${{ secrets.SFTPPASSWORD }}"
        run: |
          sshpass -e scp -r -P 22 -o StrictHostKeyChecking=no \
            /tmp/_site/* \
            ${{ secrets.SFTPUSER }}@${{ secrets.SFTPHOST }}:./jotr-nps-portolan.org/

  validate:
    needs: ["deploy"]
    runs-on: "ubuntu-latest"
    steps:
      - name: "Install uv"
        uses: "astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d" # v10.0.1

      - run: "uv run --with rashid rashid check --live ${PUBLISH_URL}"
